    <script>
        const DEMO_METHODS = [
            { id: 'm1', name: 'Cash', description: 'Pay with cash at counter', icon: 'cash', enabled: true },
            { id: 'm2', name: 'UPI / QR Code', description: 'Scan QR or enter UPI ID', icon: 'qr', enabled: true },
            { id: 'm3', name: 'Credit/Debit Card', description: 'Visa, Mastercard, RuPay', icon: 'card', enabled: true },
            { id: 'm4', name: 'Net Banking', description: 'All major banks supported', icon: 'bank', enabled: false }
        ]

        const icons = {
            cash: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>',
            qr: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>',
            card: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>',
            bank: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"></path>'
        }

        document.addEventListener('DOMContentLoaded', renderMethods)

        function renderMethods() {
            document.getElementById('methodsGrid').innerHTML = DEMO_METHODS.map(method => `
                <div class="glass-card-static p-6 flex items-start gap-4">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#FFDEE9] to-[#B5FFFC] flex items-center justify-center flex-shrink-0">
                        <svg class="w-6 h-6 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">${icons[method.icon]}</svg>
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center justify-between">
                            <h3 class="font-semibold text-slate-800">${method.name}</h3>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" ${method.enabled ? 'checked' : ''} onchange="toggleMethod('${method.id}')" class="sr-only peer">
                                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                            </label>
                        </div>
                        <p class="text-sm text-slate-500 mt-1">${method.description}</p>
                    </div>
                </div>
            `).join('')
        }

        function toggleMethod(id) {
            const method = DEMO_METHODS.find(m => m.id === id)
            if (method) {
                method.enabled = !method.enabled
                Toast.success(`${method.name} ${method.enabled ? 'enabled' : 'disabled'}`)
            }
        }
    </script>
