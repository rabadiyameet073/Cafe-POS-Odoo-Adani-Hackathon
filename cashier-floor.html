<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor View - Odoo Cafe POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="frontend/css/output.css" rel="stylesheet">
</head>

<body>
    <div class="relative min-h-screen bg-white overflow-hidden">
        <div
            class="fixed -top-40 -left-40 w-[520px] h-[520px] bg-[#FFDEE9] opacity-60 blur-[100px] rounded-full pointer-events-none">
        </div>
        <div
            class="fixed bottom-[-220px] right-[-220px] w-[620px] h-[620px] bg-[#B5FFFC] opacity-60 blur-[120px] rounded-full pointer-events-none">
        </div>

        <div class="flex min-h-screen">
            <aside
                class="fixed left-0 top-0 bottom-0 w-64 bg-white/60 backdrop-blur-md border-r border-slate-100 z-20 flex flex-col">
                <div class="h-16 px-6 flex items-center border-b border-slate-100">
                    <a href="cashier-dashboard.html" class="text-xl font-bold text-slate-800">
                        <span
                            class="bg-gradient-to-r from-[#FFDEE9] to-[#B5FFFC] bg-clip-text text-transparent">Odoo</span>
                        POS
                    </a>
                </div>
                <div class="px-4 py-3 border-b border-slate-100">
                    <div id="sessionStatus" class="px-3 py-2 rounded-xl text-sm bg-amber-50 text-amber-700">
                        <p class="font-medium">○ No Active Session</p>
                    </div>
                </div>
                <nav class="flex-1 px-3 py-4 space-y-1 overflow-auto">
                    <a href="cashier-dashboard.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-white/60">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5z"></path>
                        </svg>
                        <span class="flex-1 font-medium">Dashboard</span>
                    </a>
                    <a href="cashier-orders.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-white/60">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"></path>
                        </svg>
                        <span class="flex-1 font-medium">Orders</span>
                    </a>
                    <a href="cashier-floor.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl bg-slate-900 text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"></path>
                        </svg>
                        <span class="flex-1 font-medium">Floor View</span>
                    </a>
                    <a href="cashier-session.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-white/60">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span class="flex-1 font-medium">Session</span>
                    </a>
                    <a href="cashier-register.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-white/60">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 7h6m0 10v-3m-3 3h.01"></path>
                        </svg>
                        <span class="flex-1 font-medium">Register</span>
                    </a>
                </nav>
                <div class="p-4 border-t border-slate-100">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-10 h-10 rounded-full bg-gradient-to-r from-[#FFDEE9] to-[#B5FFFC] flex items-center justify-center">
                            <svg class="w-[18px] h-[18px] text-slate-700" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p id="userName" class="text-sm font-medium text-slate-700 truncate">Cashier</p>
                            <p id="userRole" class="text-xs text-slate-400">Cashier</p>
                        </div>
                        <button id="logoutBtn" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg"
                            title="Logout">
                            <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 16l4-4m0 0l-4-4m4 4H7"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </aside>

            <main class="flex-1 ml-64 relative z-10">
                <div class="max-w-7xl mx-auto px-6 py-6">
                    <div class="animate-fade-in">
                        <h1 class="text-3xl font-bold text-slate-800 mb-6">Floor View</h1>

                        <div id="floorSelector" class="flex flex-wrap gap-2 mb-6"></div>

                        <div id="statsGrid" class="grid grid-cols-4 gap-4 mb-6"></div>

                        <div id="tablesGrid"
                            class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-4"></div>

                        <div id="emptyState" class="hidden text-center py-12">
                            <svg class="w-12 h-12 mx-auto text-slate-300 mb-4" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                                </path>
                            </svg>
                            <p class="text-slate-500">No tables on this floor</p>
                        </div>

                        <div class="flex flex-wrap gap-4 mt-8 pt-4 border-t border-slate-100">
                            <div class="flex items-center gap-2">
                                <div class="w-4 h-4 rounded-full bg-emerald-400"></div>
                                <span class="text-sm text-slate-600">Available - Click to create order</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="w-4 h-4 rounded-full bg-red-400"></div>
                                <span class="text-sm text-slate-600">Occupied - Click to view order</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="w-4 h-4 rounded-full bg-amber-400"></div>
                                <span class="text-sm text-slate-600">Reserved</span>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="frontend/js/constants.js"></script>
    <script src="frontend/js/api.js"></script>
    <script src="frontend/js/auth.js"></script>
    <script src="frontend/js/formatters.js"></script>
    <script src="frontend/js/components/toast.js"></script>
    <script src="frontend/js/cashier/layout.js"></script>
    <script src="frontend/js/cashier/floor.js"></script>
</body>

</html>
