<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Management - Odoo Cafe POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="frontend/css/output.css" rel="stylesheet">
</head>

<body>
    <div class="relative min-h-screen bg-white overflow-hidden">
        <div
            class="fixed -top-40 -left-40 w-[520px] h-[520px] bg-[#FFDEE9] opacity-60 blur-[100px] rounded-full pointer-events-none">
        </div>
        <div
            class="fixed bottom-[-220px] right-[-220px] w-[620px] h-[620px] bg-[#B5FFFC] opacity-60 blur-[120px] rounded-full pointer-events-none">
        </div>

        <div class="flex min-h-screen">
            <aside
                class="fixed left-0 top-0 bottom-0 w-64 bg-white/60 backdrop-blur-md border-r border-slate-100 z-20 flex flex-col">
                <div class="h-16 px-6 flex items-center border-b border-slate-100">
                    <a href="cashier-dashboard.html" class="text-xl font-bold text-slate-800">
                        <span
                            class="bg-gradient-to-r from-[#FFDEE9] to-[#B5FFFC] bg-clip-text text-transparent">Odoo</span>
                        POS
                    </a>
                </div>
                <div class="px-4 py-3 border-b border-slate-100">
                    <div id="sessionStatus" class="px-3 py-2 rounded-xl text-sm bg-amber-50 text-amber-700">
                        <p class="font-medium">○ No Active Session</p>
                    </div>
                </div>
                <nav class="flex-1 px-3 py-4 space-y-1 overflow-auto">
                    <a href="cashier-dashboard.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-slate-600 hover:bg-white/60">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5z"></path>
                        </svg>
                        <span class="flex-1 font-medium">Dashboard</span>
                    </a>
                    <a href="cashier-orders.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-slate-600 hover:bg-white/60">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"></path>
                        </svg>
                        <span class="flex-1 font-medium">Orders</span>
                    </a>
                    <a href="cashier-floor.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-slate-600 hover:bg-white/60">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"></path>
                        </svg>
                        <span class="flex-1 font-medium">Floor View</span>
                    </a>
                    <a href="cashier-session.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl transition-all bg-slate-900 text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span class="flex-1 font-medium">Session</span>
                    </a>
                    <a href="cashier-register.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-slate-600 hover:bg-white/60">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 7h6m0 10v-3m-3 3h.01"></path>
                        </svg>
                        <span class="flex-1 font-medium">Register</span>
                    </a>
                </nav>
                <div class="p-4 border-t border-slate-100">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-10 h-10 rounded-full bg-gradient-to-r from-[#FFDEE9] to-[#B5FFFC] flex items-center justify-center">
                            <svg class="w-[18px] h-[18px] text-slate-700" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p id="userName" class="text-sm font-medium text-slate-700 truncate">Cashier</p>
                            <p id="userRole" class="text-xs text-slate-400">Cashier</p>
                        </div>
                        <button id="logoutBtn" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg"
                            title="Logout">
                            <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 16l4-4m0 0l-4-4m4 4H7"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </aside>

            <main class="flex-1 ml-64 relative z-10">
                <div class="max-w-7xl mx-auto px-6 py-6">
                    <div class="animate-fade-in">
                        <h1 class="text-3xl font-bold text-slate-800 mb-6">Session Management</h1>

                        <div id="sessionCard" class="glass-card-static p-6 mb-6">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-4">
                                    <div id="sessionIcon"
                                        class="w-12 h-12 rounded-xl flex items-center justify-center bg-slate-100 text-slate-400">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <p id="sessionTitle" class="text-lg font-semibold text-slate-800">No Active
                                            Session</p>
                                        <p id="sessionSubtitle" class="text-slate-500"></p>
                                    </div>
                                </div>
                                <button id="sessionActionBtn" class="btn-primary flex items-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z">
                                        </path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    Open Session
                                </button>
                            </div>
                        </div>

                        <div id="sessionDetails" class="hidden grid md:grid-cols-3 gap-4 mb-6">
                            <div class="glass-card-static p-4 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-blue-100 flex items-center justify-center">
                                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                </div>
                                <div>
                                    <p class="text-sm text-slate-500">Opened At</p>
                                    <p id="openedAt" class="font-semibold text-slate-800">-</p>
                                </div>
                            </div>
                            <div class="glass-card-static p-4 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-emerald-100 flex items-center justify-center">
                                    <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2"></path>
                                    </svg>
                                </div>
                                <div>
                                    <p class="text-sm text-slate-500">Opening Balance</p>
                                    <p id="openingBalance" class="font-semibold text-slate-800">₹0</p>
                                </div>
                            </div>
                            <div class="glass-card-static p-4 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-purple-100 flex items-center justify-center">
                                    <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2"></path>
                                    </svg>
                                </div>
                                <div>
                                    <p class="text-sm text-slate-500">Current Balance</p>
                                    <p id="currentBalance" class="font-semibold text-slate-800">₹0</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="openSessionModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/20 backdrop-blur-sm" onclick="closeOpenModal()"></div>
        <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-md">
            <div class="flex items-center justify-between p-4 border-b border-slate-100">
                <h3 class="text-lg font-semibold text-slate-800">Open New Session</h3>
                <button onclick="closeOpenModal()" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
            <div class="p-6">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Opening Cash Balance</label>
                    <input type="number" id="openingBalanceInput" placeholder="Enter amount" class="input-field">
                </div>
                <button id="confirmOpenBtn" class="btn-primary w-full">Open Session</button>
            </div>
        </div>
    </div>

    <div id="closeSessionModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/20 backdrop-blur-sm" onclick="closeCloseModal()"></div>
        <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-md">
            <div class="flex items-center justify-between p-4 border-b border-slate-100">
                <h3 class="text-lg font-semibold text-slate-800">Close Session</h3>
                <button onclick="closeCloseModal()" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
            <div class="p-6">
                <div id="closingSummary" class="bg-slate-50 rounded-xl p-4 mb-4"></div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Closing Notes (optional)</label>
                    <textarea id="closingNotesInput" rows="3" placeholder="Any notes for this session..."
                        class="input-textarea"></textarea>
                </div>
                <button id="confirmCloseBtn"
                    class="w-full py-3 rounded-xl font-medium bg-red-500 hover:bg-red-600 text-white transition-all">Close
                    Session</button>
            </div>
        </div>
    </div>

    <script src="frontend/js/constants.js"></script>
    <script src="frontend/js/api.js"></script>
    <script src="frontend/js/auth.js"></script>
    <script src="frontend/js/formatters.js"></script>
    <script src="frontend/js/components/toast.js"></script>
    <script src="frontend/js/cashier/layout.js"></script>
    <script src="frontend/js/cashier/session.js"></script>
</body>

</html>
