<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Odoo Cafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="frontend/css/output.css" rel="stylesheet">
</head>

<body>
    <div class="relative min-h-screen bg-white overflow-hidden">
        <div
            class="fixed -top-40 -left-40 w-[520px] h-[520px] bg-[#FFDEE9] opacity-60 blur-[100px] rounded-full pointer-events-none">
        </div>
        <div
            class="fixed bottom-[-220px] right-[-220px] w-[620px] h-[620px] bg-[#B5FFFC] opacity-60 blur-[120px] rounded-full pointer-events-none">
        </div>

        <header class="sticky top-0 z-30 bg-white/60 backdrop-blur-md border-b border-slate-100">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <a href="customer-floors.html" class="flex items-center gap-2">
                    <span class="text-xl font-bold text-slate-800">
                        <span
                            class="bg-gradient-to-r from-[#FFDEE9] to-[#B5FFFC] bg-clip-text text-transparent">Odoo</span>
                        Cafe
                    </span>
                </a>
                <div class="flex items-center gap-2 pl-3">
                    <div class="hidden sm:block text-right">
                        <p id="userName" class="text-sm font-medium text-slate-700">Customer</p>
                        <p class="text-xs text-slate-400">Customer</p>
                    </div>
                    <button id="logoutBtn"
                        class="p-2 text-slate-400 hover:text-slate-600 hover:bg-white/50 rounded-lg transition-all"
                        title="Logout">
                        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="relative z-10 max-w-2xl mx-auto px-4 py-6">
            <div class="animate-fade-in">
                <a href="customer-cart.html"
                    class="flex items-center gap-2 text-slate-500 hover:text-slate-700 mb-4 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    <span>Back to Cart</span>
                </a>

                <div class="mb-6">
                    <h1 class="text-3xl font-bold text-slate-800">Payment</h1>
                    <p class="text-slate-500 mt-1">Choose your preferred payment method</p>
                </div>

                <div class="glass-card-static p-6 mb-6">
                    <h3 class="text-lg font-semibold text-slate-800 mb-4">Order Summary</h3>
                    <div class="space-y-3 pb-4 border-b border-slate-100">
                        <div class="flex justify-between text-slate-600">
                            <span>Subtotal</span>
                            <span id="subtotal">₹0.00</span>
                        </div>
                        <div class="flex justify-between text-slate-600">
                            <span>Tax (5%)</span>
                            <span id="tax">₹0.00</span>
                        </div>
                    </div>
                    <div class="flex justify-between text-xl font-bold text-slate-800 py-4">
                        <span>Total</span>
                        <span id="total">₹0.00</span>
                    </div>
                </div>

                <div class="glass-card-static p-6 mb-6">
                    <h3 class="text-lg font-semibold text-slate-800 mb-4">Payment Method</h3>
                    <div class="space-y-3">
                        <label
                            class="flex items-center gap-4 p-4 rounded-xl border-2 border-slate-100 hover:border-slate-300 cursor-pointer transition-all">
                            <input type="radio" name="payment" value="cash" class="w-5 h-5 text-slate-900" checked>
                            <div class="flex-1">
                                <p class="font-medium text-slate-800">Cash</p>
                                <p class="text-sm text-slate-500">Pay with cash at counter</p>
                            </div>
                            <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z">
                                </path>
                            </svg>
                        </label>
                        <label
                            class="flex items-center gap-4 p-4 rounded-xl border-2 border-slate-100 hover:border-slate-300 cursor-pointer transition-all">
                            <input type="radio" name="payment" value="upi_qr" class="w-5 h-5 text-slate-900">
                            <div class="flex-1">
                                <p class="font-medium text-slate-800">UPI / QR Code</p>
                                <p class="text-sm text-slate-500">Scan QR or enter UPI ID</p>
                            </div>
                            <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z">
                                </path>
                            </svg>
                        </label>
                        <label
                            class="flex items-center gap-4 p-4 rounded-xl border-2 border-slate-100 hover:border-slate-300 cursor-pointer transition-all">
                            <input type="radio" name="payment" value="card" class="w-5 h-5 text-slate-900">
                            <div class="flex-1">
                                <p class="font-medium text-slate-800">Card</p>
                                <p class="text-sm text-slate-500">Credit or debit card</p>
                            </div>
                            <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z">
                                </path>
                            </svg>
                        </label>
                    </div>
                </div>

                <button id="confirmPaymentBtn" class="btn-primary w-full flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    Confirm Order
                </button>
            </div>
        </main>
    </div>

    <script src="frontend/js/constants.js"></script>
    <script src="frontend/js/api.js"></script>
    <script src="frontend/js/auth.js"></script>
    <script src="frontend/js/formatters.js"></script>
    <script src="frontend/js/components/toast.js"></script>
    <script src="frontend/js/components/loading.js"></script>
    <script src="frontend/js/components/modal.js"></script>
    <script src="frontend/js/customer/layout.js"></script>
    <script src="frontend/js/customer/payment.js"></script>
</body>

</html>
