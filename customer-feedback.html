<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Odoo Cafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="frontend/css/output.css" rel="stylesheet">
</head>

<body>
    <div class="relative min-h-screen bg-white overflow-hidden">
        <div
            class="fixed -top-40 -left-40 w-[520px] h-[520px] bg-[#FFDEE9] opacity-60 blur-[100px] rounded-full pointer-events-none">
        </div>
        <div
            class="fixed bottom-[-220px] right-[-220px] w-[620px] h-[620px] bg-[#B5FFFC] opacity-60 blur-[120px] rounded-full pointer-events-none">
        </div>

        <header class="sticky top-0 z-30 bg-white/60 backdrop-blur-md border-b border-slate-100">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <a href="customer-floors.html" class="flex items-center gap-2">
                    <span class="text-xl font-bold text-slate-800">
                        <span
                            class="bg-gradient-to-r from-[#FFDEE9] to-[#B5FFFC] bg-clip-text text-transparent">Odoo</span>
                        Cafe
                    </span>
                </a>
                <div class="flex items-center gap-2 pl-3">
                    <div class="hidden sm:block text-right">
                        <p id="userName" class="text-sm font-medium text-slate-700">Customer</p>
                        <p class="text-xs text-slate-400">Customer</p>
                    </div>
                    <button id="logoutBtn"
                        class="p-2 text-slate-400 hover:text-slate-600 hover:bg-white/50 rounded-lg transition-all"
                        title="Logout">
                        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="relative z-10 max-w-xl mx-auto px-4 py-6">
            <div class="animate-fade-in">
                <div class="text-center mb-8">
                    <div
                        class="w-16 h-16 rounded-full bg-gradient-to-br from-[#FFDEE9] to-[#B5FFFC] flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                            </path>
                        </svg>
                    </div>
                    <h1 class="text-3xl font-bold text-slate-800">How was your experience?</h1>
                    <p class="text-slate-500 mt-2">Your feedback helps us improve</p>
                </div>

                <div class="glass-card-static p-6">
                    <div class="mb-6">
                        <p class="text-sm font-medium text-slate-700 mb-3">Rate your experience</p>
                        <div id="ratingContainer" class="flex justify-center gap-2">
                            <button onclick="setRating(1)"
                                class="rating-btn w-12 h-12 rounded-full border-2 border-slate-200 flex items-center justify-center text-2xl hover:border-amber-400 hover:bg-amber-50 transition-all">😞</button>
                            <button onclick="setRating(2)"
                                class="rating-btn w-12 h-12 rounded-full border-2 border-slate-200 flex items-center justify-center text-2xl hover:border-amber-400 hover:bg-amber-50 transition-all">😐</button>
                            <button onclick="setRating(3)"
                                class="rating-btn w-12 h-12 rounded-full border-2 border-slate-200 flex items-center justify-center text-2xl hover:border-amber-400 hover:bg-amber-50 transition-all">🙂</button>
                            <button onclick="setRating(4)"
                                class="rating-btn w-12 h-12 rounded-full border-2 border-slate-200 flex items-center justify-center text-2xl hover:border-amber-400 hover:bg-amber-50 transition-all">😊</button>
                            <button onclick="setRating(5)"
                                class="rating-btn w-12 h-12 rounded-full border-2 border-slate-200 flex items-center justify-center text-2xl hover:border-amber-400 hover:bg-amber-50 transition-all">😍</button>
                        </div>
                    </div>

                    <div class="mb-6">
                        <label class="text-sm font-medium text-slate-700 mb-2 block">Comments (optional)</label>
                        <textarea id="comments" rows="4" placeholder="Tell us more about your experience..."
                            class="input-textarea"></textarea>
                    </div>

                    <button id="submitFeedbackBtn" class="btn-primary w-full">Submit Feedback</button>
                </div>

                <div class="text-center mt-6">
                    <a href="customer-menu.html" class="text-slate-500 hover:text-slate-700 text-sm">Skip and
                        continue browsing</a>
                </div>
            </div>
        </main>
    </div>

    <script src="frontend/js/constants.js"></script>
    <script src="frontend/js/api.js"></script>
    <script src="frontend/js/auth.js"></script>
    <script src="frontend/js/components/toast.js"></script>
    <script src="frontend/js/components/loading.js"></script>
    <script src="frontend/js/customer/layout.js"></script>
    <script src="frontend/js/customer/feedback.js"></script>
</body>

</html>
