<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Register - Odoo Cafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="frontend/css/output.css" rel="stylesheet">
</head>

<body>
    <div class="relative min-h-screen bg-white overflow-hidden">
        <div
            class="fixed -top-40 -left-40 w-[520px] h-[520px] bg-[#FFDEE9] opacity-60 blur-[100px] rounded-full pointer-events-none">
        </div>
        <div
            class="fixed bottom-[-220px] right-[-220px] w-[620px] h-[620px] bg-[#B5FFFC] opacity-60 blur-[120px] rounded-full pointer-events-none">
        </div>

        <div class="flex min-h-screen">
            <aside
                class="fixed left-0 top-0 bottom-0 w-64 bg-white/60 backdrop-blur-md border-r border-slate-100 z-20 flex flex-col">
                <div class="h-16 px-6 flex items-center border-b border-slate-100">
                    <a href="cashier-dashboard.html" class="text-xl font-bold text-slate-800">
                        <span
                            class="bg-gradient-to-r from-[#FFDEE9] to-[#B5FFFC] bg-clip-text text-transparent">Odoo</span>
                        POS
                    </a>
                </div>

                <div class="px-4 py-3 border-b border-slate-100">
                    <div id="sessionStatus" class="px-3 py-2 rounded-xl text-sm bg-amber-50 text-amber-700">
                        <p class="font-medium">○ No Active Session</p>
                    </div>
                </div>

                <nav class="flex-1 px-3 py-4 space-y-1 overflow-auto">
                    <a href="cashier-dashboard.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl transition-all group text-slate-600 hover:bg-white/60 hover:text-slate-900">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z">
                            </path>
                        </svg>
                        <span class="flex-1 font-medium">Dashboard</span>
                    </a>
                    <a href="cashier-orders.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl transition-all group text-slate-600 hover:bg-white/60 hover:text-slate-900">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                            </path>
                        </svg>
                        <span class="flex-1 font-medium">Orders</span>
                    </a>
                    <a href="cashier-floor.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl transition-all group text-slate-600 hover:bg-white/60 hover:text-slate-900">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                            </path>
                        </svg>
                        <span class="flex-1 font-medium">Floor View</span>
                    </a>
                    <a href="cashier-session.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl transition-all group text-slate-600 hover:bg-white/60 hover:text-slate-900">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span class="flex-1 font-medium">Session</span>
                    </a>
                    <a href="cashier-register.html"
                        class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl transition-all group bg-slate-900 text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z">
                            </path>
                        </svg>
                        <span class="flex-1 font-medium">Register</span>
                    </a>
                </nav>

                <div class="p-4 border-t border-slate-100">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-10 h-10 rounded-full bg-gradient-to-r from-[#FFDEE9] to-[#B5FFFC] flex items-center justify-center">
                            <svg class="w-[18px] h-[18px] text-slate-700" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p id="userName" class="text-sm font-medium text-slate-700 truncate">Cashier</p>
                            <p id="userRole" class="text-xs text-slate-400">Cashier</p>
                        </div>
                        <button id="logoutBtn"
                            class="p-2 text-slate-400 hover:text-slate-600 hover:bg-white/50 rounded-lg transition-all"
                            title="Logout">
                            <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                                </path>
                            </svg>
                        </button>
                    </div>
                </div>
            </aside>

            <main class="flex-1 ml-64 relative z-10 flex flex-col h-screen overflow-hidden">
                <header
                    class="h-16 px-6 border-b border-slate-100 bg-white/60 backdrop-blur-md flex items-center justify-between shrink-0">
                    <div>
                        <h1 class="text-xl font-bold text-slate-800">New Order</h1>
                        <p id="sessionInfo" class="text-xs text-slate-500">Checking session...</p>
                    </div>
                </header>

                <div class="flex-1 overflow-hidden flex">
                    <!-- Products Section -->
                    <div class="flex-1 flex flex-col min-w-0 border-r border-slate-100">
                        <!-- Filters -->
                        <div class="p-4 border-b border-slate-100 flex gap-4 overflow-x-auto shrink-0 bg-white/40">
                            <div class="relative w-64 shrink-0">
                                <input type="text" id="searchInput" placeholder="Search products..."
                                    class="w-full pl-10 pr-4 py-2 bg-white/60 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900/10 text-sm">
                                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </div>
                            <div id="categoryFilters" class="flex gap-2">
                                <!-- Categories injected here -->
                            </div>
                        </div>

                        <!-- Product Grid -->
                        <div class="flex-1 overflow-y-auto p-4 bg-slate-50/50">
                            <div id="loadingState" class="h-full flex items-center justify-center">
                                <div
                                    class="w-8 h-8 border-4 border-slate-200 border-t-slate-900 rounded-full animate-spin">
                                </div>
                            </div>
                            <div id="productsGrid"
                                class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 hidden">
                                <!-- Products injected here -->
                            </div>
                            <div id="emptyState"
                                class="hidden h-full flex flex-col items-center justify-center text-slate-400">
                                <svg class="w-12 h-12 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4">
                                    </path>
                                </svg>
                                <p>No products found</p>
                            </div>
                        </div>
                    </div>

                    <!-- Cart Section -->
                    <div class="w-96 flex flex-col bg-white shrink-0 shadow-xl z-20">
                        <div class="p-4 border-b border-slate-100">
                            <h2 class="font-semibold text-slate-800">Current Order</h2>
                            <div class="mt-2 flex items-center justify-between text-sm">
                                <span class="text-slate-500">Order #</span>
                                <span
                                    class="font-medium font-mono bg-slate-100 px-2 py-0.5 rounded text-slate-600">NEW</span>
                            </div>
                        </div>

                        <!-- User Selection -->
                        <div class="p-4 border-b border-slate-100 bg-slate-50">
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Select Table
                                        (Optional)</label>
                                    <select id="tableSelect" class="w-full text-sm border-slate-200 rounded-lg">
                                        <option value="">No Table (Takeaway)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Cart Items -->
                        <div class="flex-1 overflow-y-auto p-4">
                            <div id="cartItems" class="space-y-3">
                                <!-- Cart items injected here -->
                            </div>
                            <div id="emptyCart"
                                class="h-full flex flex-col items-center justify-center text-slate-400 py-10">
                                <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
                                    </path>
                                </svg>
                                <p class="text-sm">Cart is empty</p>
                            </div>
                        </div>

                        <!-- Totals & Actions -->
                        <div class="p-4 bg-slate-50 border-t border-slate-100">
                            <div class="space-y-2 mb-4">
                                <div class="flex justify-between text-sm text-slate-500">
                                    <span>Subtotal</span>
                                    <span id="cartSubtotal">₹0.00</span>
                                </div>
                                <div class="flex justify-between text-sm text-slate-500">
                                    <span>Tax</span>
                                    <span id="cartTax">₹0.00</span>
                                </div>
                                <div
                                    class="flex justify-between font-bold text-lg text-slate-800 pt-2 border-t border-slate-200">
                                    <span>Total</span>
                                    <span id="cartTotal">₹0.00</span>
                                </div>
                            </div>

                            <button id="payBtn" disabled
                                class="w-full btn-primary py-3 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                                <span>Proceed to Payment</span>
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="paymentModal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>
        <div class="flex min-h-full items-center justify-center p-4">
            <div
                class="relative transform overflow-hidden rounded-2xl bg-white shadow-xl transition-all sm:w-full sm:max-w-lg">
                <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                    <h3 class="text-lg font-semibold leading-6 text-slate-900 mb-4" id="modalTitle">Select Payment
                        Method</h3>
                    <div class="grid grid-cols-2 gap-3 mb-6" id="paymentMethodsGrid">
                        <!-- Methods injected here -->
                    </div>
                    <div id="qrCodeContainer" class="hidden text-center p-4 bg-slate-50 rounded-xl mb-4">
                        <!-- QR Code injected here -->
                    </div>
                </div>
                <div class="bg-slate-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                    <button type="button" id="confirmPaymentBtn" disabled
                        class="btn-primary w-full sm:w-auto sm:ml-3 disabled:opacity-50">
                        Confirm Payment
                    </button>
                    <button type="button" onclick="closePaymentModal()"
                        class="mt-3 inline-flex w-full justify-center rounded-xl bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 sm:mt-0 sm:w-auto">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="frontend/js/constants.js"></script>
    <script src="frontend/js/api.js"></script>
    <script src="frontend/js/auth.js"></script>
    <script src="frontend/js/formatters.js"></script>
    <script src="frontend/js/components/toast.js"></script>
    <script src="frontend/js/components/loading.js"></script>
    <script src="frontend/js/cashier/layout.js"></script>
    <script src="frontend/js/cashier/register.js"></script>
</body>

</html>
