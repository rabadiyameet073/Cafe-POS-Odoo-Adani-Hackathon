<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Odoo Cafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="frontend/css/output.css" rel="stylesheet">
</head>

<body>
    <div class="relative min-h-screen bg-white overflow-hidden">
        <div
            class="fixed -top-40 -left-40 w-[520px] h-[520px] bg-[#FFDEE9] opacity-60 blur-[100px] rounded-full pointer-events-none">
        </div>
        <div
            class="fixed bottom-[-220px] right-[-220px] w-[620px] h-[620px] bg-[#B5FFFC] opacity-60 blur-[120px] rounded-full pointer-events-none">
        </div>

        <header class="sticky top-0 z-30 bg-white/60 backdrop-blur-md border-b border-slate-100">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <a href="customer-floors.html" class="flex items-center gap-2">
                    <span class="text-xl font-bold text-slate-800">
                        <span
                            class="bg-gradient-to-r from-[#FFDEE9] to-[#B5FFFC] bg-clip-text text-transparent">Odoo</span>
                        Cafe
                    </span>
                </a>

                <nav class="hidden md:flex items-center gap-1">
                    <a href="customer-floors.html"
                        class="nav-link flex items-center gap-2 px-4 py-2 rounded-xl transition-all text-slate-600 hover:bg-white/50 hover:text-slate-900">
                        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                            </path>
                        </svg>
                        <span class="font-medium">Tables</span>
                    </a>
                    <a href="customer-menu.html"
                        class="nav-link flex items-center gap-2 px-4 py-2 rounded-xl transition-all text-slate-600 hover:bg-white/50 hover:text-slate-900">
                        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                            </path>
                        </svg>
                        <span class="font-medium">Menu</span>
                    </a>
                    <a href="customer-order-tracking.html"
                        class="nav-link flex items-center gap-2 px-4 py-2 rounded-xl transition-all text-slate-600 hover:bg-white/50 hover:text-slate-900">
                        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01">
                            </path>
                        </svg>
                        <span class="font-medium">Orders</span>
                    </a>
                </nav>

                <div class="flex items-center gap-3">
                    <a href="customer-cart.html"
                        class="nav-link relative flex items-center gap-2 px-4 py-2 rounded-xl transition-all bg-slate-900 text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
                            </path>
                        </svg>
                        <span class="hidden sm:inline font-medium">Cart</span>
                        <span
                            class="cart-badge hidden absolute -top-1 -right-1 w-5 h-5 bg-gradient-to-r from-[#FFDEE9] to-[#B5FFFC] text-slate-900 text-xs font-bold rounded-full flex items-center justify-center">0</span>
                    </a>

                    <div class="flex items-center gap-2 pl-3 border-l border-slate-200">
                        <div class="hidden sm:block text-right">
                            <p id="userName" class="text-sm font-medium text-slate-700">Customer</p>
                            <p class="text-xs text-slate-400">Customer</p>
                        </div>
                        <button id="logoutBtn"
                            class="p-2 text-slate-400 hover:text-slate-600 hover:bg-white/50 rounded-lg transition-all"
                            title="Logout">
                            <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                                </path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="relative z-10 max-w-7xl mx-auto px-4 py-6 pb-24 md:pb-6">
            <div id="pageContent" class="animate-fade-in">
                <div id="emptyCart" class="hidden min-h-[60vh] flex flex-col items-center justify-center">
                    <div class="w-24 h-24 rounded-full bg-slate-100 flex items-center justify-center mb-6">
                        <svg class="w-10 h-10 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
                            </path>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">Your cart is empty</h2>
                    <p class="text-slate-500 mb-6">Add some delicious items to get started</p>
                    <a href="customer-menu.html" class="btn-primary flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                        Back to Menu
                    </a>
                </div>

                <div id="cartContent" class="hidden">
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <h1 class="text-3xl font-bold text-slate-800">Your Cart</h1>
                            <p id="itemCount" class="text-slate-500 mt-1">0 items</p>
                        </div>
                        <button id="clearCartBtn"
                            class="text-red-500 hover:text-red-600 text-sm flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                </path>
                            </svg>
                            Clear Cart
                        </button>
                    </div>

                    <div class="grid lg:grid-cols-3 gap-6">
                        <div id="cartItems" class="lg:col-span-2 space-y-4"></div>

                        <div class="lg:col-span-1">
                            <div class="glass-card-static p-6 sticky top-24">
                                <h3 class="text-lg font-semibold text-slate-800 mb-4">Order Summary</h3>
                                <div class="space-y-3 pb-4 border-b border-slate-100">
                                    <div class="flex justify-between text-slate-600">
                                        <span>Subtotal</span>
                                        <span id="subtotal">₹0.00</span>
                                    </div>
                                    <div class="flex justify-between text-slate-600">
                                        <span>Tax (5%)</span>
                                        <span id="tax">₹0.00</span>
                                    </div>
                                </div>
                                <div class="flex justify-between text-lg font-bold text-slate-800 py-4">
                                    <span>Total</span>
                                    <span id="total">₹0.00</span>
                                </div>
                                <button id="proceedPaymentBtn"
                                    class="btn-primary w-full flex items-center justify-center gap-2">
                                    Proceed to Payment
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                                    </svg>
                                </button>
                                <a href="customer-menu.html"
                                    class="btn-secondary w-full mt-2 text-center block">Continue Shopping</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <nav
            class="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-white/80 backdrop-blur-md border-t border-slate-100 px-4 py-2">
            <div class="flex items-center justify-around">
                <a href="customer-floors.html"
                    class="mobile-nav-link flex flex-col items-center gap-1 px-3 py-2 rounded-xl transition-all text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                        </path>
                    </svg>
                    <span class="text-xs font-medium">Tables</span>
                </a>
                <a href="customer-menu.html"
                    class="mobile-nav-link flex flex-col items-center gap-1 px-3 py-2 rounded-xl transition-all text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                        </path>
                    </svg>
                    <span class="text-xs font-medium">Menu</span>
                </a>
                <a href="customer-order-tracking.html"
                    class="mobile-nav-link flex flex-col items-center gap-1 px-3 py-2 rounded-xl transition-all text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01">
                        </path>
                    </svg>
                    <span class="text-xs font-medium">Orders</span>
                </a>
                <a href="customer-cart.html"
                    class="mobile-nav-link relative flex flex-col items-center gap-1 px-3 py-2 rounded-xl transition-all text-slate-900">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
                        </path>
                    </svg>
                    <span class="text-xs font-medium">Cart</span>
                    <span
                        class="cart-badge hidden absolute top-0 right-0 w-4 h-4 bg-gradient-to-r from-[#FFDEE9] to-[#B5FFFC] text-slate-900 text-[10px] font-bold rounded-full flex items-center justify-center">0</span>
                </a>
            </div>
        </nav>
    </div>

    <script src="frontend/js/constants.js"></script>
    <script src="frontend/js/api.js"></script>
    <script src="frontend/js/auth.js"></script>
    <script src="frontend/js/formatters.js"></script>
    <script src="frontend/js/components/toast.js"></script>
    <script src="frontend/js/customer/layout.js"></script>
    <script src="frontend/js/customer/cart.js"></script>
</body>

</html>
